services:
  - type: web
    name: stock-portfolio-tw
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npx prisma db push && npx next build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stock-portfolio-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: stock-portfolio-db
    databaseName: stock_portfolio
    plan: free
